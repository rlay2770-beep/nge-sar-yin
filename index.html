<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>အတိုး/ငွေချေး စီမံခန့်ခွဲမှု စနစ် (လအလိုက် စာရင်း)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; }
    .card { max-width: 650px; margin: 0 auto 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2, h3 { color: #1a252f; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    .info-box { background: #eef6ff; border-left: 4px solid #3498db; padding: 10px; margin-bottom: 12px; font-size: 13px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; font-weight: bold; color: white; }
    .btn-green { background: #27ae60; }
    .btn-blue { background: #2980b9; }
    .btn-orange { background: #e67e22; }
    .btn-print { background: #27ae60; padding: 5px 8px; font-size: 11px; width: auto; border-radius: 3px; }
    .btn-delete { background: #e74c3c; padding: 5px 8px; font-size: 11px; width: auto; border-radius: 3px; margin-left: 3px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #34495e; color: white; }
    .flex-actions { display: flex; justify-content: center; align-items: center; }

    /* Dashboard Cards Layout */
    .dashboard-grid { display: flex; gap: 10px; justify-content: space-between; margin-bottom: 15px; }
    .dash-card { flex: 1; background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 4px solid #3498db; text-align: center; }
    .dash-card.green { border-top-color: #27ae60; }
    .dash-card.red { border-top-color: #e74c3c; }
    .dash-title { font-size: 11px; color: #555; font-weight: bold; }
    .dash-value { font-size: 15px; font-weight: bold; color: #2c3e50; margin-top: 5px; }

    .month-picker-container { max-width: 650px; margin: 0 auto 15px auto; background: #2c3e50; padding: 10px; border-radius: 8px; color: white; display: flex; align-items: center; justify-content: space-between; }
    .month-picker-container select { width: 60%; background: #fff; color: #000; font-weight: bold; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC2THh7u-bT5u7A7Rkjkkguqc5xOb42WsM",
      authDomain: "nge-sar-yin.firebaseapp.com",
      projectId: "nge-sar-yin",
      storageBucket: "nge-sar-yin.firebasestorage.app",
      messagingSenderId: "75854336100",
      appId: "1:75854336100:web:2068a3d44e3e5b38540f71",
      measurementId: "G-VV376VMB9S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let borrowersList = [];
    let allTransactions = [];

    function initDataListeners() {
      // 1. Listen to Borrowers
      onSnapshot(collection(db, "borrowers"), (snapshot) => {
        borrowersList = [];
        snapshot.forEach((docSnap) => {
          borrowersList.push({ id: docSnap.id, ...docSnap.data() });
        });
        recalculateDashboard();
        updateDropdowns();
      });

      // 2. Listen to Transactions
      onSnapshot(collection(db, "transactions"), (snapshot) => {
        allTransactions = [];
        snapshot.forEach((docSnap) => {
          allTransactions.push({ id: docSnap.id, ...docSnap.data() });
        });
        allTransactions.sort((a, b) => new Date(b.payDate) - new Date(a.payDate));
        recalculateDashboard();
        renderHistoryTable();
      });
    }

    function updateDropdowns() {
      const select = document.getElementById("borrowerSelect");
      const addSelect = document.getElementById("addPrincipalBorrowerSelect");
      const filterSelect = document.getElementById("filterBorrower");

      if (select) select.innerHTML = '<option value="">-- အကြွေးယူသူ ရွေးပါ --</option>';
      if (addSelect) addSelect.innerHTML = '<option value="">-- အကြွေးယူသူ ရွေးပါ --</option>';
      if (filterSelect) filterSelect.innerHTML = '<option value="ALL">လူအားလုံး စာရင်းကြည့်မည်</option>';

      borrowersList.forEach((data) => {
        const principal = Number(data.principal || 0);
        const rate = Number(data.rate || 0);
        const optionText = `${data.name} (အရင်း: ${principal.toLocaleString()} Ks | ${rate}%)`;

        if (select) select.appendChild(new Option(optionText, data.id));
        if (addSelect) addSelect.appendChild(new Option(optionText, data.id));
        if (filterSelect) filterSelect.appendChild(new Option(data.name, data.id));
      });
    }

    // လအလိုက် Dashboard ပြန်လည်တွက်ချက်ခြင်း
    function recalculateDashboard() {
      const selectedMonth = document.getElementById("selectedMonthFilter").value; // e.g. "2026-09"
      
      let totalInvestment = 0;
      let totalExpectedMonthlyInterest = 0;
      let receivedInterestThisMonth = 0;

      borrowersList.forEach(b => {
        const principal = Number(b.principal || 0);
        const rate = Number(b.rate || 0);
        totalInvestment += principal;
        totalExpectedMonthlyInterest += (principal * rate) / 100;
      });

      // ရွေးချယ်ထားသော လထဲတွင် ရရှိခဲ့သော အတိုးများ ပေါင်းယူခြင်း
      allTransactions.forEach(t => {
        if (t.payDate && t.payDate.startsWith(selectedMonth)) {
          receivedInterestThisMonth += Number(t.interestPaid || 0);
        }
      });

      const pendingInterestThisMonth = Math.max(0, totalExpectedMonthlyInterest - receivedInterestThisMonth);

      document.getElementById("totalInvestment").innerText = totalInvestment.toLocaleString() + " Ks";
      document.getElementById("totalReceivedInterest").innerText = receivedInterestThisMonth.toLocaleString() + " Ks";
      document.getElementById("totalPendingInterest").innerText = pendingInterestThisMonth.toLocaleString() + " Ks";
    }

    function renderHistoryTable() {
      const filterId = document.getElementById("filterBorrower").value;
      const selectedMonth = document.getElementById("selectedMonthFilter").value;
      const tableBody = document.getElementById("historyTable");
      tableBody.innerHTML = "";

      // လအလိုက် သို့မဟုတ် လူအလိုက် စစ်ထုတ်ခြင်း
      const filteredData = allTransactions.filter(t => {
        const matchMonth = t.payDate && t.payDate.startsWith(selectedMonth);
        const matchBorrower = (filterId === "ALL" || t.borrowerId === filterId);
        return matchMonth && matchBorrower;
      });

      if (filteredData.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" style="color:red; text-align:center;">ရွေးချယ်ထားသော လအတွက် မှတ်တမ်း မရှိသေးပါ။</td></tr>';
        return;
      }

      filteredData.forEach((t) => {
        const type = t.type || (t.principalPaid < 0 ? 'ADD' : 'PAY');
        let principalText = type === 'ADD' 
          ? `<b style="color:red;">+${Math.abs(t.principalPaid || 0).toLocaleString()}</b>`
          : `<b style="color:blue;">-${Number(t.principalPaid || 0).toLocaleString()}</b>`;

        const row = tableBody.insertRow();
        row.innerHTML = `
          <td>${t.payDate || '-'}</td>
          <td><b>${t.borrowerName || '-'}</b></td>
          <td style="color:green; font-weight:bold;">${Number(t.interestPaid || 0).toLocaleString()}</td>
          <td>${principalText}</td>
          <td style="text-align:left;">${t.remark || '-'}</td>
          <td><button type="button" class="btn-delete btn-del-trans" data-id="${t.id}">ဖျက်ရန်</button></td>
        `;
      });

      document.querySelectorAll('.btn-del-trans').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (confirm("ဤမှတ်တမ်းကို ဖျက်ပစ်ရန် သေချာပါသလား?")) {
            await deleteDoc(doc(db, "transactions", e.target.dataset.id));
          }
        });
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      // Current Month Set (e.g., 2026-09)
      const now = new Date();
      const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      document.getElementById("selectedMonthFilter").value = currentMonthStr;

      initDataListeners();

      document.getElementById("selectedMonthFilter").addEventListener("change", () => {
        recalculateDashboard();
        renderHistoryTable();
      });

      document.getElementById("filterBorrower").addEventListener("change", renderHistoryTable);
    });
  </script>
</head>
<body>

<div id="mainAppSection">

  <!-- လအလိုက် ရွေးချယ်နိုင်သော Dropdown -->
  <div class="month-picker-container">
    <label style="margin:0;">ကြည့်ရှုလိုသည့် လ ရွေးပါ :</label>
    <input type="month" id="selectedMonthFilter" style="width:50%; padding:5px;">
  </div>

  <!-- Dashboard Overview -->
  <div style="max-width: 650px; margin: 0 auto 10px auto;">
    <div class="dashboard-grid">
      <div class="dash-card">
        <div class="dash-title">လက်ရှိ စုစုပေါင်း အရင်းငွေ</div>
        <div class="dash-value" id="totalInvestment">0 Ks</div>
      </div>
      <div class="dash-card green">
        <div class="dash-title">ဤလ ရရှိပြီး အတိုး</div>
        <div class="dash-value" id="totalReceivedInterest" style="color: #27ae60;">0 Ks</div>
      </div>
      <div class="dash-card red">
        <div class="dash-title">ဤလ ရရန်ကျန် အတိုး</div>
        <div class="dash-value" id="totalPendingInterest" style="color: #e74c3c;">0 Ks</div>
      </div>
    </div>
  </div>

  <!-- စာရင်းဇယားပြသသည့် အပိုင်း -->
  <div class="card">
    <h3>ငွေဝင်မှတ်တမ်းများ (Statement History)</h3>
    <div class="form-group">
      <select id="filterBorrower"><option value="ALL">လူအားလုံး စာရင်းကြည့်မည်</option></select>
    </div>
    <table>
      <thead>
        <tr><th>ရက်စွဲ</th><th>အမည်</th><th>အတိုး (Ks)</th><th>အရင်း (Ks)</th><th>မှတ်ချက်</th><th>လုပ်ဆောင်ချက်</th></tr>
      </thead>
      <tbody id="historyTable"></tbody>
    </table>
  </div>

</div>

</body>
  </html>
